<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro atacado</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="signup-shell">
      <section class="signup-panel">
        <p class="eyebrow">Venos Modas</p>
        <h1>Solicitar acesso ao atacado</h1>
        <p>Preencha os dados da empresa para solicitar acesso aos preços de atacado.</p>

        <form id="wholesaleSignupForm" class="signup-form">
          <label>
            Razao social
            <input name="companyName" required />
          </label>
          <label>
            Nome do responsavel
            <input name="name" required />
          </label>
          <label>
            E-mail
            <input name="email" type="email" required />
          </label>
          <label>
            Telefone
            <input name="phone" />
          </label>
          <label>
            CNPJ
            <input name="cnpj" required />
          </label>
          <button class="primary" type="submit">Enviar solicitacao</button>
        </form>

        <pre id="signupResult"></pre>
      </section>
    </main>

    <script>
      const form = document.querySelector("#wholesaleSignupForm");
      const result = document.querySelector("#signupResult");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const response = await fetch("/api/wholesale-requests", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(Object.fromEntries(new FormData(form).entries()))
        });
        const data = await response.json();
        result.textContent = response.ok
          ? "Solicitacao enviada. Aguarde a aprovacao da loja."
          : data.error || "Nao foi possivel enviar a solicitacao.";
        if (response.ok) form.reset();
      });
    </script>
  </body>
</html>
